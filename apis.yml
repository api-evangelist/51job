name: 51job
description: >-
  51job (前程无忧) is one of China's largest online recruitment and human resource
  services platforms, operated by 51job, Inc. Founded in 1998 and headquartered
  in Shanghai, the company connects job seekers and employers through its
  flagship 51job.com website and mobile apps, alongside enterprise hiring
  services (ehire.51job.com), campus recruitment, HR outsourcing, training, and
  assessment offerings. Formerly listed on NASDAQ under the ticker JOBS, 51job
  was taken private in 2022 by an investor consortium that included DCM, Ocean
  Link, and company management. 51job does not publish a public developer API or
  open platform; partner and applicant-tracking integrations (for example via
  SAP SuccessFactors Recruiting Posting) are arranged through its sales and
  support teams under contract. This profile was surfaced as a portfolio company
  of dcm-ventures and enriched from 51job's public web properties.
